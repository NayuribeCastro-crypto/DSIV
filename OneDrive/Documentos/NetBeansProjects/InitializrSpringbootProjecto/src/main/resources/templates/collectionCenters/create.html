<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">

<head>
    <title>Registrar Centro de Acopio</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<div>Formulario para registrar centro de acopio</div>

<section layout:fragment="content">
    <div class="row">
        <div class="container-fluid">
            <fieldset>
                <form th:method="POST"
                      th:action="@{/collectionCenters/save}"
                      th:object="${collectionCenter}">

                    <div class="col-12 form-group">
                        <label>Nombre</label>
                        <input class="form-control" type="text" th:field="*{name}" required/>
                    </div>

                    <div class="col-12 form-group">
                        <label>Teléfono</label>
                        <input class="form-control" type="text" th:field="*{phone}" required/>
                    </div>

                    <div class="col-12 form-group">
                        <label>Dirección</label>
                        <input class="form-control" type="text" th:field="*{address}" required/>
                    </div>

                    <div class="col-12 form-group">
                        <label>Encargado</label>
                        <input class="form-control" type="text" th:field="*{personInCharge}" required/>
                    </div>

                    <div class="col-12 form-group">
                        <label>Observación</label>
                        <textarea class="form-control" th:field="*{observation}" required></textarea>
                    </div>

                    <div class="col-12 text-end">
                        <button class="btn btn-success" type="submit">
                            <i class="fa fa-save"></i> Crear centro
                        </button>
                        <a class="btn btn-default" th:href="@{/collectionCenters/index}">Cancelar</a>
                    </div>
                </form>
            </fieldset>
        </div>
    </div>
</section>
</body>
</html>
